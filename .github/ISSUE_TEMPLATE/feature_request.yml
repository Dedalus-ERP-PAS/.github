name: Demande de fonctionnalité
description: Proposer une nouvelle fonctionnalité ou une amélioration
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Merci pour votre proposition ! Décrivez le besoin avant la solution.

  - type: textarea
    id: probleme
    attributes:
      label: Problème / besoin
      description: Quel problème cette fonctionnalité résout-elle ? Pour quel utilisateur ?
      placeholder: "En tant que… je veux… afin de…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Décrivez le comportement souhaité.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Autres approches ou contournements existants.
    validations:
      required: false

  - type: textarea
    id: contexte
    attributes:
      label: Contexte complémentaire
      description: Maquettes, liens, impact métier, priorité…
    validations:
      required: false
